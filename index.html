<!DOCTYPE html>
<!--
  RUTA - Registro Unificado de Traslados y Activos
  Reto Conaltura (EstudIA)
  Este archivo es el "esqueleto" de la página: aquí solo va la ESTRUCTURA.
  - Los estilos generales están en css/estilos.css
  - Los estilos del módulo de activos están en css/activos-adquisiciones.css
  - La lógica principal está en js/app.js
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUTA | Conaltura</title>

  <!-- Letras redondeadas parecidas a las de la marca Conaltura. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <!-- Primero se cargan los estilos generales y después los del nuevo módulo. -->
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/activos-adquisiciones.css">
</head>

<!-- La clase "en-ingreso" muestra la imagen de fondo.
     app.js la quita al entrar y la vuelve a colocar al salir. -->
<body class="en-ingreso">
  <!-- ===== ENCABEZADO: SIEMPRE VISIBLE ===== -->
  <header class="encabezado">
    <div class="marca">
      <!-- Menú ☰: vive en el encabezado (se esconde en la pantalla de ingreso) -->
      <button id="botonMenu" class="boton-hamburguesa" aria-label="Abrir menú"
              aria-expanded="false" aria-controls="menuLateral">
        <span></span><span></span><span></span>
      </button>
      <h1 class="logo">
        <button id="botonLogo" type="button" aria-label="Ir al inicio">
          <img src="img/logo-ruta.png" alt="RUTA · Registro Unificado de Traslados y Activos" width="94" height="44">
        </button>
      </h1>
    </div>
    <!-- Menú horizontal para computador (lo llena app.js según el rol) -->
    <nav id="navSuperior" class="nav-superior" aria-label="Secciones"></nav>

    <div class="encabezado-derecha">
      <!-- Aquí aparece la cuenta conectada (lo llena app.js) -->
      <div id="usuarioActual" class="usuario-actual oculto"></div>
    </div>
  </header>

  <main>
    <!-- ===== PANTALLA 0: CARGANDO ===== -->
    <section id="pantallaCargando" class="tarjeta ingreso">
      <p class="vacio" role="status" aria-live="polite">
        ⏳ Conectando con RUTA...
      </p>
    </section>

    <!-- ===== PANTALLA 1: INGRESO ===== -->
    <section id="pantallaIngreso" class="tarjeta ingreso oculto">
      <h2>Bienvenido a RUTA</h2>
      <p class="slogan-ingreso">Cada elemento con su ruta.</p>
      <p class="subtitulo">
        Organiza, prioriza y gestiona el inventario de las salas de ventas,
        apartamentos modelo y bodegas.
      </p>

      <!-- El formulario permite ingresar con el botón o con la tecla Enter. -->
      <form id="formIngreso" class="formulario">
        <label for="campoUsuario">Usuario</label>
        <input
          type="text"
          id="campoUsuario"
          placeholder="Ej: vendedor"
          autocomplete="username"
          required
        >

        <label for="campoContrasena">Contraseña</label>
        <input
          type="password"
          id="campoContrasena"
          placeholder="Tu contraseña"
          autocomplete="current-password"
          required
        >

        <p id="mensajeError" class="error oculto" role="alert" aria-live="assertive">
          Usuario o contraseña incorrectos.
        </p>

        <button type="submit" id="botonIngresar" class="boton">
          Ingresar
        </button>
      </form>
    </section>

    <!-- ===== PANTALLA 2: PANEL PRINCIPAL ===== -->
    <section id="pantallaPanel" class="oculto">

      <!-- Barra de navegación: botón Atrás y nombre de la sección -->
      <div class="barra-navegacion">
        <button id="botonAtras" class="boton-atras oculto">← Atrás</button>
        <span id="tituloSeccion" class="titulo-seccion">Inicio</span>
      </div>

      <!-- El fondo oscuro permite cerrar el menú lateral. -->
      <div id="fondoMenu" class="fondo-menu oculto"></div>

      <nav id="menuLateral" class="menu-lateral" aria-label="Menú principal">
        <div class="menu-lateral-encabezado">
          <span>Menú</span>
          <button
            type="button"
            id="cerrarMenu"
            class="cerrar-menu"
            aria-label="Cerrar menú"
          >
            ✕
          </button>
        </div>

        <!-- app.js crea las opciones según el rol autenticado. -->
        <div id="menu" class="menu"></div>
      </nav>

      <!-- Todos los módulos cargan su interfaz dentro de este contenedor. -->
      <div id="contenido" class="tarjeta" aria-live="polite"></div>
    </section>
  </main>

  <footer class="pie">
    Prototipo académico · Reto EstudIA.
  </footer>

  <!--
    1. SheetJS permite importar y exportar archivos de Excel.
    2. app.js inicia la aplicación y carga el resto de módulos.
    Por ser módulos JavaScript, la aplicación debe ejecutarse desde un
    servidor local o desde GitHub Pages, no abriendo el HTML con doble clic.
  -->
  <script src="js/lib/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
