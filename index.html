<!DOCTYPE html>
<!--
  RUTA - Registro Unificado de Traslados y Activos
  Reto Conaltura (EstudIA)

  Este archivo es el "esqueleto" de la página: aquí solo va la ESTRUCTURA.
  - Los colores y el diseño están en css/estilos.css
  - La lógica (lo que pasa al hacer clic) está en js/app.js
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUTA | Conaltura</title>
  <!-- Letras redondeadas parecidas a las de la marca Conaltura (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<!-- La clase "en-ingreso" muestra la imagen de fondo (marca de agua).
     app.js la quita al entrar y la vuelve a poner al salir. -->
<body class="en-ingreso">

  <!-- ===== ENCABEZADO: siempre visible ===== -->
  <header class="encabezado">
    <div class="marca">
      <!-- Menú ☰: vive en el encabezado (se esconde en la pantalla de ingreso) -->
      <button id="botonMenu" class="boton-hamburguesa" aria-label="Abrir menú"
              aria-expanded="false" aria-controls="menuLateral">
        <span></span><span></span><span></span>
      </button>
      <h1 class="logo">
        <button id="botonLogo" type="button" aria-label="Ir al inicio">
          <img src="img/logo-ruta.png" alt="RUTA · Registro Unificado de Traslados y Activos" width="94" height="44">
        </button>
      </h1>
    </div>
    <!-- Menú horizontal para computador (lo llena app.js según el rol) -->
    <nav id="navSuperior" class="nav-superior" aria-label="Secciones"></nav>

    <div class="encabezado-derecha">
      <!-- Aquí aparece la cuenta conectada (lo llena app.js) -->
      <div id="usuarioActual" class="usuario-actual oculto"></div>
    </div>
  </header>

  <main>

    <!-- ===== PANTALLA 0: CARGANDO (mientras Firebase revisa si hay sesión) ===== -->
    <section id="pantallaCargando" class="tarjeta ingreso">
      <p class="vacio">⏳ Conectando con RUTA...</p>
    </section>

    <!-- ===== PANTALLA 1: INGRESO ===== -->
    <section id="pantallaIngreso" class="tarjeta ingreso oculto">
      <h2>Bienvenido a RUTA</h2>
      <p class="slogan-ingreso">Cada elemento con su ruta.</p>
      <p class="subtitulo">
        Organiza, prioriza y gestiona el inventario de las salas de ventas,
        apartamentos modelo y bodegas.
      </p>

      <!-- Usamos un formulario para que también se pueda ingresar con Enter -->
      <form id="formIngreso" class="formulario">
        <label for="campoUsuario">Usuario</label>
        <input type="text" id="campoUsuario" placeholder="Ej: vendedor" autocomplete="username" required>

        <label for="campoContrasena">Contraseña</label>
        <input type="password" id="campoContrasena" placeholder="Tu contraseña" autocomplete="current-password" required>

        <!-- Aquí sale el mensaje si el usuario o la contraseña están mal -->
        <p id="mensajeError" class="error oculto">Usuario o contraseña incorrectos.</p>

        <button type="submit" id="botonIngresar" class="boton">Ingresar</button>
      </form>
    </section>

    <!-- ===== PANTALLA 2: PANEL PRINCIPAL (oculto hasta ingresar) ===== -->
    <section id="pantallaPanel" class="oculto">

      <!-- Barra de navegación: botón Atrás y nombre de la sección -->
      <div class="barra-navegacion">
        <button id="botonAtras" class="boton-atras oculto">← Atrás</button>
        <span id="tituloSeccion" class="titulo-seccion">Inicio</span>
      </div>

      <!-- Menú lateral (se abre con ☰). El fondo oscuro lo cierra al tocarlo. -->
      <div id="fondoMenu" class="fondo-menu oculto"></div>
      <nav id="menuLateral" class="menu-lateral" aria-label="Menú principal">
        <div class="menu-lateral-encabezado">
          <span>Menú</span>
          <button id="cerrarMenu" class="cerrar-menu" aria-label="Cerrar menú">✕</button>
        </div>
        <!-- Las opciones las crea app.js según el rol -->
        <div id="menu" class="menu"></div>
      </nav>

      <!-- Aquí se muestra el contenido de la opción elegida -->
      <div id="contenido" class="tarjeta"></div>

    </section>

  </main>

  <footer class="pie">
    Prototipo académico · Reto EstudIA.
  </footer>

  <!-- JavaScript:
       1) La librería para leer y crear archivos de Excel (SheetJS).
       2) app.js, que arranca todo. Es type="module" porque usa "import"
          para traer los otros archivos:
            app.js -> inventario.js -> datos.js -> firebase-config.js
          OJO: por ser módulo, la página NO abre con doble clic.
          Hay que abrirla con Live Server (VS Code) o desde GitHub Pages. -->
  <script src="js/lib/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
